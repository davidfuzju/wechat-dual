# Push a v* tag → test, build the dmg, publish a GitHub Release with the dmg and its sha256.
# A manual run (workflow_dispatch) only builds and uploads the dmg as an Actions artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh derives the version from git describe / rev-list

      - name: Test
        run: swift test

      - name: Build dmg
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wechat-duo-dmg
          path: dist/*.dmg*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 \
            --title "WeChat Duo ${GITHUB_REF_NAME}" --generate-notes \
            --notes "Download the dmg and drag WeChat Duo into Applications. First launch: right-click → Open (ad-hoc signed, not notarized)."
